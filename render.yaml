# ==============================================================================
# Render Blueprint Specification for Knotrun Demo / Studio
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  # 1. Managed PostgreSQL Database
  - name: knotrun-db
    databaseName: knotrun_prod
    user: knotrun_user
    plan: free
    region: oregon

services:
  # 2. Knotrun Studio Backend API (Node Web Service)
  - type: web
    name: knotrun-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: knotrun-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: COOKIE_SAME_SITE
        value: none
      - key: REDIS_URL
        sync: false

  # 3. Knotrun Studio UI (Static Site on Global CDN)
  - type: web
    name: knotrun-studio
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist/client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: knotrun-api
          envVarKey: RENDER_EXTERNAL_URL
